# Сохтани APK-и «Журнали мактаб» (android/).
# Натиҷа: GitHub → Releases (барои зеркашӣ аз телефон) ва шохаи `apk` (танҳо версияи охирин).
# Суроғаи сайт: Settings → Secrets and variables → Actions → Variables → APP_URL.
name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: android, cancel-in-progress: true }

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: ${{ vars.APP_URL || 'https://portali-maorif.onrender.com' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }

      - name: assembleRelease
        run: gradle -p android --no-daemon assembleRelease

      - name: Номгузорӣ ва санҷиши имзо
        run: |
          VER="1.0.${VERSION_CODE}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Jurnali-maktab-$VER.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/Jurnali-maktab-$VER.apk" | head -3
          "$BT/aapt2" dump badging "dist/Jurnali-maktab-$VER.apk" | grep -E "^package|application-label|sdkVersion|targetSdk" || true
          ls -lh dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v$VER" "dist/Jurnali-maktab-$VER.apk" \
            --title "Журнали мактаб $VER" \
            --notes "APK барои Android 7+. Сайт: $APP_URL" \
            --target "$GITHUB_SHA"

      - name: Шохаи apk (версияи охирин)
        run: |
          cd dist
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Версия: %s\nСайт: %s\nCommit: %s\n' "$VER" "$APP_URL" "$GITHUB_SHA" > VERSION.txt
          git add -A && git commit -qm "APK $VER"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
