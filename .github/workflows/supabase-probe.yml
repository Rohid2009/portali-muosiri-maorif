# Як бор: кадом суроғаи pooler-и Supabase ба лоиҳа тааллуқ дорад (бо пароли нодуруст —
# «Tenant or user not found» = суроғаи нодуруст, «password authentication failed» = дуруст).
name: supabase-probe
on:
  push:
    paths: ['.github/workflows/supabase-probe.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          REF=bdzbtiyttuekcehgbgqf
          for h in aws-0-eu-central-1 aws-1-eu-central-1; do
            for p in 5432 6543; do
              OUT=$(docker run --rm -e PGPASSWORD=wrong-password -e PGCONNECT_TIMEOUT=10 postgres:17 \
                psql "host=$h.pooler.supabase.com port=$p user=maorif_app.$REF dbname=postgres sslmode=require" -c 'select 1' 2>&1 | tail -1 || true)
              echo "PROBE $h:$p => $OUT"
            done
          done
