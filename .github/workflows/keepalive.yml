# Сайтро бедор нигоҳ медорад (Render-и ройгон баъди 15 дақ. бекорӣ хоб меравад)
# ва ба база дархост мефиристад (Supabase-и ройгон баъди 1 ҳафтаи бекорӣ қатъ мешавад).
# Variables → SITE_URL = https://portali-maorif.onrender.com (бе / дар охир)
name: keepalive
on:
  schedule:
    - cron: '*/14 2-12 * * 1-6'   # Душанбе–Шанбе, 07:00–17:59 бо вақти Душанбе
    - cron: '17 4 * * 0'           # Якшанбе як бор (база хоб наравад)
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.SITE_URL }}/api/health"
