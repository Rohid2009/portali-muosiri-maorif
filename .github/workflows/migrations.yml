# Миграцияи базаро худкор месозад, вақте prisma/schema.prisma тағйир меёбад.
# Натиҷа: папкаи нав дар prisma/migrations/ ба ҳамин шоха commit мешавад.
# Сервер (Render: `prisma migrate deploy`) онро дар deploy-и навбатӣ татбиқ мекунад.
# ⚠️ Агар тағйирот маълумотро нест кунад (сутун/ҷадвал), SQL-ро пеш аз deploy хонед.
name: migrations

on:
  push:
    branches: [main]
    paths: ['prisma/schema.prisma', '.github/workflows/migrations.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: migrations, cancel-in-progress: false }

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      shadow:
        image: postgres:17
        env: { POSTGRES_PASSWORD: shadow }
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:shadow@localhost:5434/postgres
      DIRECT_URL: postgresql://postgres:shadow@localhost:5434/postgres
      SHADOW: postgresql://postgres:shadow@localhost:5434/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Фарқи схема ва миграцияҳо
        run: |
          docker run --rm --network host -e PGPASSWORD=shadow postgres:17 \
            psql -h localhost -p 5434 -U postgres -c 'CREATE DATABASE shadow'
          if ls prisma/migrations/*/migration.sql >/dev/null 2>&1; then
            FROM="--from-migrations prisma/migrations --shadow-database-url $SHADOW"
          else
            FROM="--from-empty"
          fi
          npx prisma migrate diff $FROM --to-schema-datamodel prisma/schema.prisma --script > /tmp/m.sql
          if grep -qvE '^\s*(--.*)?$' /tmp/m.sql; then
            NAME="$(date -u +%Y%m%d%H%M%S)_auto"
            mkdir -p "prisma/migrations/$NAME"
            mv /tmp/m.sql "prisma/migrations/$NAME/migration.sql"
            printf '# Please do not edit this file manually\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
            echo "NEW=$NAME" >> "$GITHUB_ENV"
            cat "prisma/migrations/$NAME/migration.sql"
          else
            echo "Тағйирот нест."
          fi
      - name: Санҷиш дар базаи холӣ
        if: env.NEW != ''
        run: npx prisma migrate deploy && npx prisma db execute --file prisma/sql/audit_log_append_only.sql --schema prisma/schema.prisma
      - name: Commit
        if: env.NEW != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "Миграцияи худкор: $NEW"
          git push
