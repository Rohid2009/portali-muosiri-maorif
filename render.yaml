# Render Blueprint: dashboard.render.com → New → Blueprint → ҳамин репозиторий.
# Қиматҳои «sync: false»-ро Render ҳангоми сохтан мепурсад (онҳо ба GitHub намераванд).
services:
  - type: web
    name: portali-maorif
    runtime: node
    plan: free
    region: frankfurt          # дар паҳлӯи Supabase (eu-central-1)
    branch: main
    autoDeploy: true
    buildFilter:
      ignoredPaths: ['android/**', '.github/**', 'docs/**']
    buildCommand: npm install --no-audit --no-fund && npm run deploy:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: SCHOOL_NAME
        value: МТМУ №12
      - key: SCHOOL_DISTRICT
        value: Зафаробод
      - key: SEED_DIRECTOR_LOGIN
        value: mudir
      - key: SEED_DIRECTOR_NAME
        value: Мудири мактаб
      - key: SEED_SPECIALIST
        value: "0"
      # ⚠️ Махфӣ: репозиторий бояд PRIVATE бимонад. Пароли базаро дар Supabase иваз карда,
      # ин ҷо ва дар Render → Environment навсозӣ кардан мумкин аст.
      - key: DATABASE_URL         # Supabase, transaction pooler (6543)
        value: "postgresql://maorif_app.bdzbtiyttuekcehgbgqf:149f90949f95468438942f52268fddf12fd9f13434f0426f@aws-0-eu-central-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=5&schema=maorif&sslmode=require"
      - key: DIRECT_URL           # Supabase, session pooler (5432)
        value: "postgresql://maorif_app.bdzbtiyttuekcehgbgqf:149f90949f95468438942f52268fddf12fd9f13434f0426f@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?schema=maorif&sslmode=require"
      - key: SEED_DIRECTOR_PASSWORD   # пароли муваққатӣ; дар воридшавии аввал иваз мешавад
        value: "Mudir-e84a31"
