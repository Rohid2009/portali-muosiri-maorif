# /etc/nginx/sites-available/maorif — HTTPS ҳатмӣ (сертификат: certbot --nginx -d maktab.example.tj)
server {
    listen 80;
    server_name maktab.example.tj;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maktab.example.tj;

    ssl_certificate     /etc/letsencrypt/live/maktab.example.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maktab.example.tj/privkey.pem;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Файлҳои static — кэши дароз (интернети суст)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP-и воқеӣ барои rate limiting
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
