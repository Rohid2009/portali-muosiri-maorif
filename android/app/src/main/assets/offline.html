<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пайваст нест</title>
<style>
  html,body{margin:0;height:100%;background:#050d24;color:#e6ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;text-align:center;
    background:radial-gradient(120% 70% at 50% 0%,#0b2a7a 0%,#050d24 70%)}
  .ico{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);margin-bottom:22px}
  h1{font-size:22px;margin:0 0 10px}
  p{margin:0 0 26px;color:#a9b6d9;line-height:1.55;max-width:320px;font-size:15px}
  a.btn{display:inline-block;padding:14px 30px;border-radius:999px;background:#38bdf8;color:#04122f;font-weight:700;text-decoration:none;font-size:16px}
  small{display:block;margin-top:22px;color:#6c7aa3;font-size:12.5px;line-height:1.5;max-width:300px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ico">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/>
    </svg>
  </div>
  <h1>Пайваст ба портал нашуд</h1>
  <p>Интернетро санҷед ва боз кӯшиш кунед. Агар сервер нав бедор шуда истода бошад, як дақиқа сабр кунед.</p>
  <a class="btn" id="retry" href="#">Боз кӯшиш</a>
  <small>Журнали электронии МТМУ №12</small>
</div>
<script>
  var u = new URLSearchParams(location.search).get('u');
  if (u && /^https:\/\//.test(u)) document.getElementById('retry').href = u;
</script>
</body>
</html>
